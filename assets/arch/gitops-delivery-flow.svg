<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">GitOps 배포 흐름 — GitHub Actions CI, k8s-gitops-configs App of Apps, Argo CD 동기화, EKS 클러스터</title>
  <desc id="d">애플리케이션 저장소에 push 하면 GitHub Actions가 이미지를 빌드해 GHCR에 올리고 GitOps 저장소의 이미지 태그를 갱신한다. Argo CD가 루트 앱(App of Apps)을 통해 변경을 감지해 모니터링·로깅·스토리지·애플리케이션을 클러스터에 동기화하고, 시크릿은 Sealed Secrets로 암호화해 Git에 둔다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'SUIT', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif; fill: #1a1a2e; }
    .h1 { font-size: 26px; font-weight: 800; }
    .sub { font-size: 16px; fill: #718096; }
    .layer { font-size: 20px; font-weight: 800; }
    .bt { font-size: 17.5px; font-weight: 700; }
    .bl { font-size: 15px; fill: #4a5568; }
    .chip { font-size: 14.5px; font-weight: 600; fill: #065f46; }
    .edge { font-size: 14.5px; font-weight: 600; fill: #4a5568; }
    .note { font-size: 14px; fill: #718096; }
  </style>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <text x="48" y="54" class="h1">GitOps 배포 흐름 — CI는 이미지와 태그까지, 배포는 Git이 결정</text>
  <text x="1552" y="54" class="sub" text-anchor="end">devopslabs-jcg 저장소 5개</text>

  <!-- ① CI -->
  <rect x="40" y="84" width="400" height="776" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="62" y="114" class="layer" style="fill:#1d4ed8">① CI · GitHub Actions</text>
  <rect x="62" y="134" width="356" height="132" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="82" y="164" class="bt">k8s-metric-app</text>
  <text x="82" y="192" class="bl">Flask 백엔드 · React(Vite) 프런트</text>
  <text x="82" y="216" class="bl">클러스터 상태·메트릭 대시보드</text>
  <text x="82" y="240" class="bl">main 브랜치 push 가 트리거</text>
  <line x1="240" y1="266" x2="240" y2="304" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="62" y="306" width="356" height="150" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="82" y="336" class="bt">build job</text>
  <text x="82" y="364" class="bl">backend·frontend 이미지 빌드</text>
  <text x="82" y="388" class="bl">GHCR 에 push</text>
  <text x="82" y="412" class="bl">태그: 커밋 SHA + latest</text>
  <line x1="240" y1="456" x2="240" y2="494" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="62" y="496" width="356" height="170" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="82" y="526" class="bt">update-gitops job</text>
  <text x="82" y="554" class="bl">k8s-gitops-configs 체크아웃</text>
  <text x="82" y="578" class="bl">kubewatch values.yaml 의</text>
  <text x="82" y="602" class="bl">이미지 태그를 새 SHA로 갱신</text>
  <text x="82" y="626" class="bl">커밋·push (전용 토큰은 시크릿)</text>
  <rect x="62" y="690" width="356" height="148" rx="10" fill="#f8f9fa" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="82" y="720" class="bt">GHCR</text>
  <text x="82" y="748" class="bl">GitHub Container Registry</text>
  <text x="82" y="772" class="bl">클러스터가 SHA 태그 이미지를</text>
  <text x="82" y="796" class="bl">당겨 롤링 업데이트</text>

  <!-- ② Git: k8s-gitops-configs -->
  <rect x="480" y="84" width="560" height="776" rx="14" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="502" y="114" class="layer" style="fill:#047857">② Git · k8s-gitops-configs</text>
  <text x="502" y="138" class="note">클러스터의 모든 상태를 선언 — 단일 진실 공급원</text>
  <rect x="502" y="156" width="516" height="96" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="522" y="186" class="bt">Root App · gitops-app-manager.yaml</text>
  <text x="522" y="214" class="bl">App of Apps 진입점 — kubectl 로 한 번만 배포</text>
  <text x="522" y="236" class="bl">이후 모든 앱 그룹을 Argo CD가 관리</text>
  <line x1="760" y1="252" x2="760" y2="278" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ah)"/>
  <rect x="502" y="280" width="516" height="216" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="522" y="308" class="bt">argocd-apps/ — 앱 그룹별 Application</text>
  <rect x="522" y="324" width="148" height="34" rx="17" fill="#ecfdf5" stroke="#34d399"/>
  <text x="596" y="346" class="chip" text-anchor="middle">monitoring</text>
  <rect x="682" y="324" width="148" height="34" rx="17" fill="#ecfdf5" stroke="#34d399"/>
  <text x="756" y="346" class="chip" text-anchor="middle">logging</text>
  <rect x="842" y="324" width="148" height="34" rx="17" fill="#ecfdf5" stroke="#34d399"/>
  <text x="916" y="346" class="chip" text-anchor="middle">platform</text>
  <rect x="522" y="368" width="148" height="34" rx="17" fill="#ecfdf5" stroke="#34d399"/>
  <text x="596" y="390" class="chip" text-anchor="middle">core</text>
  <rect x="682" y="368" width="148" height="34" rx="17" fill="#ecfdf5" stroke="#34d399"/>
  <text x="756" y="390" class="chip" text-anchor="middle">apps</text>
  <text x="522" y="432" class="bl">apps → k8s-app-helm-charts/kubewatch 차트</text>
  <text x="522" y="456" class="bl">monitoring → k8s-platform-configs 차트 참조</text>
  <text x="522" y="480" class="bl">logging → 공식 Elastic 차트 + 우리 values</text>
  <rect x="502" y="512" width="516" height="146" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="522" y="540" class="bt">secrets/ — Sealed Secrets</text>
  <text x="522" y="568" class="bl">kubeseal 로 공개키 암호화한 SealedSecret 만 커밋</text>
  <text x="522" y="592" class="bl">원본 Secret 은 Git 에 넣지 않음</text>
  <text x="522" y="616" class="bl">클러스터의 컨트롤러가 Secret 으로 복호화</text>
  <rect x="502" y="674" width="516" height="164" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="522" y="702" class="bt">crds/ · argocd-full/</text>
  <text x="522" y="730" class="bl">prometheus-operator CRD 를 동기화 전에 선행 적용</text>
  <text x="522" y="754" class="bl">Argo CD 자체 설치 매니페스트(초기 부트스트랩)</text>
  <text x="522" y="778" class="bl">저장소는 Argo CD 에 Private 저장소로 등록</text>

  <!-- ①→② : update-gitops job 이 k8s-app-helm-charts/kubewatch/values.yaml 을 커밋 (② 배경 위에 그리도록 ② 뒤에 둔다) -->
  <path d="M418,581 H461 V427 H500" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text class="edge" text-anchor="middle" transform="translate(455 504) rotate(-90)">commit</text>

  <!-- ②→③ -->
  <line x1="1040" y1="400" x2="1098" y2="400" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="1069" y="390" class="edge" text-anchor="middle">감지</text>

  <!-- ③ Argo CD -->
  <rect x="1100" y="300" width="160" height="200" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="1180" y="352" class="layer" text-anchor="middle" style="fill:#b45309">③ Argo CD</text>
  <text x="1180" y="388" class="bl" text-anchor="middle">Git 변경 감지</text>
  <text x="1180" y="412" class="bl" text-anchor="middle">Helm 렌더링</text>
  <text x="1180" y="436" class="bl" text-anchor="middle">자동 동기화</text>
  <text x="1180" y="460" class="bl" text-anchor="middle">롤링 업데이트</text>

  <!-- ③→④ -->
  <line x1="1260" y1="400" x2="1298" y2="400" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ④ 클러스터 -->
  <rect x="1300" y="84" width="260" height="776" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="1320" y="114" class="layer" style="fill:#6d28d9">④ EKS 클러스터</text>
  <rect x="1318" y="134" width="224" height="150" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1334" y="162" class="bt">모니터링</text>
  <text x="1334" y="188" class="bl">kube-prometheus-stack</text>
  <text x="1334" y="212" class="bl">Prometheus · Grafana</text>
  <text x="1334" y="236" class="bl">Alertmanager · Operator</text>
  <text x="1334" y="260" class="bl">Node Exporter · KSM</text>
  <rect x="1318" y="300" width="224" height="126" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1334" y="328" class="bt">로깅 · EFK</text>
  <text x="1334" y="354" class="bl">Elasticsearch</text>
  <text x="1334" y="378" class="bl">Filebeat · Kibana</text>
  <rect x="1318" y="442" width="224" height="102" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1334" y="470" class="bt">스토리지</text>
  <text x="1334" y="496" class="bl">Rook-Ceph</text>
  <text x="1334" y="520" class="bl">영구 볼륨</text>
  <rect x="1318" y="560" width="224" height="126" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1334" y="588" class="bt">애플리케이션</text>
  <text x="1334" y="614" class="bl">kubewatch(metric app)</text>
  <text x="1334" y="638" class="bl">새 SHA 이미지로 교체</text>
  <rect x="1318" y="702" width="224" height="136" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1334" y="730" class="bt">Sealed Secrets</text>
  <text x="1334" y="756" class="bl">컨트롤러가</text>
  <text x="1334" y="780" class="bl">SealedSecret 을</text>
  <text x="1334" y="804" class="bl">Secret 으로 복호화</text>
</svg>
